[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olivia-agent"
version = "0.1.0"
description = "OLIVIA: agentic opportunity hunting with human approval and anti-fabrication guardrails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
olivia = "olivia.cli:main"

[tool.setuptools]
packages = ["olivia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
